---
name: CI

# Триггеры этой репы — измерены, а не унаследованы из upstream.
#
# Долгое время здесь не запускалось ничего, кроме ручного dispatch: за историю
# репы `actions/runs?event=push` давал 0 при нескольких push'ах в день, а
# временный `*/5` cron — 0 прогонов за четыре слота. Причина банальная: этот
# репозиторий — форк BlockedPath/pi-meta-oauth, и автоматические события в форках
# выключены, пока их не включат.
#
# 2026-10-03 в 11:04 UTC включили через API:
#   gh api -X PUT repos/RarogCmex/pi-meta/actions/permissions \
#     -F enabled=true -F allowed_actions=all -F sha_pinned=false
# (до этого GET по этому же эндпоинту отвечал `enabled: true`, `allowed_actions: all` —
# то есть прочитанное состояние gate'ом не было, а запись его включила). После PUT
# push-прогон появился в ту же минуту: два push'а → два completed/success
# (`Typecheck and test`), включая этот коммит.
#
# `schedule:` после этого проверили повторно (`*/5`, три слота) — по-прежнему 0
# прогонов: cron в форке не крутится и включение флагов его не оживляет. Поэтому
# расписание отсюда убрано, а не оставлено «на всякий случай»: блок cron в файле
# читается следующим человеком как существующий gate, а его нет.
#
# Что это значит на практике: gate здесь = push (работает) + ручной dispatch, а
# недельного safety-net'а нет. Если он понадобится — варианты: включить
# scheduled-прогоны через Actions-вкладку UI (не API), либо отвязать форк через
# GitHub support. Локальный cron на машине — тоже вариант, но он молча умрет
# вместе с ноутбуком.
#
# Прогоняется только офлайн-набор: живые пробы тратят реальные запросы ключа.
"on":
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  badgetizr-start:
    name: Add initial PR badges
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out Badgetizr 3.1.1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: aiKrice/homebrew-badgetizr
          ref: c616a5ccc6a59cfdf02c6645af6904df073259de # 3.1.1
          path: .badgetizr-action
          persist-credentials: false

      - name: Install pinned yq
        env:
          YQ_VERSION: v4.47.2
        run: |
          yq_sha256="1bb99e1019e23de33c7e6afc23e93dad"
          yq_sha256="${yq_sha256}72aad6cf2cb03c797f068ea79814ddb0"
          curl --fail --location --silent --show-error \
            --output /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${yq_sha256}  /tmp/yq" | sha256sum --check --strict
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      - name: Mark CI as running
        env:
          BADGETIZR_DESTINATION: ${{ github.event.pull_request.base.ref }}
          BADGETIZR_PR: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        working-directory: .badgetizr-action
        run: |
          badgetizr_build_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          badgetizr_build_url="${badgetizr_build_url}/actions/runs"
          badgetizr_build_url="${badgetizr_build_url}/${GITHUB_RUN_ID}"
          ./badgetizr \
            --provider=github \
            --configuration=../.badgetizr.yml \
            --pr-id="${BADGETIZR_PR}" \
            --pr-destination-branch="${BADGETIZR_DESTINATION}" \
            --pr-build-number="${GITHUB_RUN_ID}" \
            --pr-build-url="${badgetizr_build_url}" \
            --ci-status=started \
            --ci-text="Typecheck and test"

  typecheck-and-test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  badgetizr-result:
    name: Update final PR badges
    needs:
      - badgetizr-start
      - typecheck-and-test
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out Badgetizr 3.1.1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: aiKrice/homebrew-badgetizr
          ref: c616a5ccc6a59cfdf02c6645af6904df073259de # 3.1.1
          path: .badgetizr-action
          persist-credentials: false

      - name: Install pinned yq
        env:
          YQ_VERSION: v4.47.2
        run: |
          yq_sha256="1bb99e1019e23de33c7e6afc23e93dad"
          yq_sha256="${yq_sha256}72aad6cf2cb03c797f068ea79814ddb0"
          curl --fail --location --silent --show-error \
            --output /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${yq_sha256}  /tmp/yq" | sha256sum --check --strict
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      - name: Update CI result
        env:
          BADGETIZR_DESTINATION: ${{ github.event.pull_request.base.ref }}
          BADGETIZR_PR: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.typecheck-and-test.result }}
        working-directory: .badgetizr-action
        run: |
          badgetizr_build_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          badgetizr_build_url="${badgetizr_build_url}/actions/runs"
          badgetizr_build_url="${badgetizr_build_url}/${GITHUB_RUN_ID}"
          if [[ "${TEST_RESULT}" == "success" ]]; then
            badgetizr_status="passed"
          else
            badgetizr_status="failed"
          fi
          ./badgetizr \
            --provider=github \
            --configuration=../.badgetizr.yml \
            --pr-id="${BADGETIZR_PR}" \
            --pr-destination-branch="${BADGETIZR_DESTINATION}" \
            --pr-build-number="${GITHUB_RUN_ID}" \
            --pr-build-url="${badgetizr_build_url}" \
            --ci-status="${badgetizr_status}"
